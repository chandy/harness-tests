[project]
name = "harness-tests"
version = "0.1.0"
description = "Compare agent harnesses on a shared coding-agent benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "pydantic-ai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pytest>=8.0",
    "pydantic-ai-harness>=0.59.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness-evals = "evals.run:main"
harness-deepagents = "harnesses.deepagents.run:main"
harness-pydantic-ai-harness = "harnesses.pydantic_ai_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "evals", "harnesses"]

[tool.hatch.build]
exclude = [
    "harnesses/pi-durable",
    "/evals/output",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tasks"]
python_files = ["test_*.py"]
