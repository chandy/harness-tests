name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: harnesses/pi-durable/pnpm-lock.yaml

      - name: Install Python deps
        run: uv sync

      - name: Install pi-durable deps
        run: pnpm install
        working-directory: harnesses/pi-durable

      - name: Run evals (fake model)
        env:
          PYDANTIC_AI_NO_BANNER: "1"
          HARNESS_MODEL: fake
        run: uv run harness-evals --model fake --out evals/output

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/output/
